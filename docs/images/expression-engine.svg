<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Groki Bot 眼环合成管线</title>
  <desc id="desc">十八个眼环轮廓经过四组表情权重逐点混合，再叠加眨眼与开合度，形成每帧屏幕坐标。</desc>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #23324a;
      --muted: #5d6b82;
      --line: #6b7a90;
      --panel: #eff4fa;
      --panel-2: #e4ebf5;
      --accent: #4f46e5;
      --accent-soft: #e8e7ff;
      --teal: #0f766e;
      --teal-soft: #d9f3ef;
      --amber: #985b0d;
      --amber-soft: #fff0d2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf7;
        --muted: #afbdd0;
        --line: #8997aa;
        --panel: #182332;
        --panel-2: #223146;
        --accent: #aaa5ff;
        --accent-soft: #302e5d;
        --teal: #68d9cb;
        --teal-soft: #163e3a;
        --amber: #ffca73;
        --amber-soft: #493619;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: var(--muted); }
    .stage { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .stage-head { fill: var(--panel-2); }
    .label { font-size: 16px; font-weight: 700; }
    .body { font-size: 13px; fill: var(--muted); }
    .tiny { font-size: 11px; fill: var(--muted); }
    .arrow { fill: none; stroke: var(--line); stroke-width: 2.2; marker-end: url(#arrow); }
    .ring { fill: none; stroke: var(--accent); stroke-width: 2; }
    .eye { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
    .point { fill: var(--teal); }
    .weight { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
    .accent { fill: var(--accent); }
    .teal { fill: var(--teal); }
    .amber-panel { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/>
    </marker>
  </defs>

  <text class="title" x="28" y="38">眼环合成管线</text>
  <text class="subtitle" x="28" y="62">从轮廓数据到当帧屏幕坐标，每一帧重新计算</text>

  <path class="arrow" d="M188 225 H216"/>
  <path class="arrow" d="M420 225 H448"/>
  <path class="arrow" d="M606 225 H634"/>
  <path class="arrow" d="M786 225 H814"/>

  <g>
    <rect class="stage" x="24" y="88" width="164" height="272" rx="16"/>
    <path class="stage-head" d="M40 88h132a16 16 0 0 1 16 16v38H24v-38a16 16 0 0 1 16-16z"/>
    <text class="label" x="106" y="121" text-anchor="middle">眼环池</text>
    <ellipse class="ring" cx="83" cy="196" rx="36" ry="25" transform="rotate(-9 83 196)" opacity=".35"/>
    <ellipse class="ring" cx="92" cy="202" rx="36" ry="25" transform="rotate(-5 92 202)" opacity=".55"/>
    <ellipse class="ring" cx="101" cy="208" rx="36" ry="25"/>
    <ellipse class="ring" cx="110" cy="214" rx="36" ry="25" transform="rotate(6 110 214)" opacity=".75"/>
    <ellipse class="ring" cx="119" cy="220" rx="36" ry="25" transform="rotate(10 119 220)"/>
    <circle class="point" cx="153" cy="212" r="3"/><circle class="point" cx="136" cy="238" r="3"/>
    <circle class="point" cx="91" cy="239" r="3"/><circle class="point" cx="83" cy="211" r="3"/>
    <text class="label" x="106" y="283" text-anchor="middle">18 环</text>
    <text class="body" x="106" y="307" text-anchor="middle">每环含左右眼</text>
    <text class="body" x="106" y="328" text-anchor="middle">每眼 48 点</text>
  </g>

  <g>
    <rect class="stage" x="216" y="88" width="204" height="272" rx="16"/>
    <path class="stage-head" d="M232 88h172a16 16 0 0 1 16 16v38H216v-38a16 16 0 0 1 16-16z"/>
    <text class="label" x="318" y="121" text-anchor="middle">四组表情权重</text>
    <rect class="weight" x="240" y="164" width="156" height="34" rx="8"/>
    <rect class="weight" x="240" y="207" width="156" height="34" rx="8" opacity=".82"/>
    <rect class="weight" x="240" y="250" width="156" height="34" rx="8" opacity=".68"/>
    <rect class="weight" x="240" y="293" width="156" height="34" rx="8" opacity=".54"/>
    <text class="body" x="318" y="186" text-anchor="middle">expression_from</text>
    <text class="body" x="318" y="229" text-anchor="middle">expression_hold2_to</text>
    <text class="body" x="318" y="272" text-anchor="middle">expression_hold_to</text>
    <text class="body" x="318" y="315" text-anchor="middle">expression</text>
    <text class="tiny" x="318" y="345" text-anchor="middle">blend / hold blend 决定占比</text>
  </g>

  <g>
    <rect class="stage" x="448" y="88" width="158" height="272" rx="16"/>
    <path class="stage-head" d="M464 88h126a16 16 0 0 1 16 16v38H448v-38a16 16 0 0 1 16-16z"/>
    <text class="label" x="527" y="121" text-anchor="middle">逐点混合</text>
    <path d="M479 185 C492 161 514 161 527 185 C540 209 562 209 575 185" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <path d="M479 213 C492 189 514 189 527 213 C540 237 562 237 575 213" fill="none" stroke="var(--teal)" stroke-width="2.5" opacity=".8"/>
    <circle class="point" cx="479" cy="185" r="3"/><circle class="point" cx="503" cy="166" r="3"/>
    <circle class="point" cx="527" cy="185" r="3"/><circle class="point" cx="551" cy="204" r="3"/>
    <circle class="point" cx="575" cy="185" r="3"/>
    <text class="label" x="527" y="270" text-anchor="middle">96 点</text>
    <text class="body" x="527" y="294" text-anchor="middle">左右眼合计</text>
    <text class="body" x="527" y="318" text-anchor="middle">192 个坐标值</text>
  </g>

  <g>
    <rect class="stage" x="634" y="88" width="152" height="272" rx="16"/>
    <path class="stage-head" d="M650 88h120a16 16 0 0 1 16 16v38H634v-38a16 16 0 0 1 16-16z"/>
    <text class="label" x="710" y="121" text-anchor="middle">纵向压扁</text>
    <ellipse class="eye" cx="678" cy="190" rx="28" ry="20"/>
    <ellipse class="eye" cx="742" cy="190" rx="28" ry="20"/>
    <path d="M650 244 Q678 228 706 244 Q678 260 650 244z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
    <path d="M714 244 Q742 238 770 244 Q742 250 714 244z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
    <text class="body" x="710" y="292" text-anchor="middle">眨眼 / wink</text>
    <text class="body" x="710" y="316" text-anchor="middle">表情开合度</text>
    <text class="tiny" x="710" y="340" text-anchor="middle">绕各眼质心计算</text>
  </g>

  <g>
    <rect class="stage" x="814" y="88" width="122" height="272" rx="16"/>
    <path class="stage-head" d="M830 88h90a16 16 0 0 1 16 16v38H814v-38a16 16 0 0 1 16-16z"/>
    <text class="label" x="875" y="121" text-anchor="middle">屏幕坐标</text>
    <rect class="amber-panel" x="834" y="166" width="82" height="98" rx="10"/>
    <path d="M850 211 Q862 190 874 211 Q886 232 898 211" fill="none" stroke="var(--amber)" stroke-width="2.5"/>
    <circle class="teal" cx="850" cy="211" r="3"/><circle class="teal" cx="874" cy="211" r="3"/><circle class="teal" cx="898" cy="211" r="3"/>
    <path d="M844 252 H906 M844 252 V176" fill="none" stroke="var(--line)" stroke-width="1" opacity=".55"/>
    <text class="body" x="875" y="296" text-anchor="middle">每帧写入</text>
    <text class="body" x="875" y="319" text-anchor="middle">Avatar VM</text>
    <text class="tiny" x="875" y="340" text-anchor="middle">(x, y) × 96</text>
  </g>
</svg>
