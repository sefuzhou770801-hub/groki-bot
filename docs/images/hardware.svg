<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">CoreS3 与 Stack-chan 底座硬件连接</title>
  <desc id="desc">CoreS3 通过 I2C 连接头顶触摸、电池计、IO 扩展与电源管理芯片，通过 UART1 连接偏航和俯仰两颗 SCS0009 舵机。</desc>
  <style>
    :root { color-scheme: light dark; --ink:#23324a; --muted:#5d6b82; --line:#6b7a90; --panel:#eff4fa; --panel-2:#e4ebf5; --accent:#4f46e5; --accent-soft:#e8e7ff; --teal:#0f766e; --teal-soft:#d9f3ef; --amber:#985b0d; --amber-soft:#fff0d2; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e6edf7; --muted:#afbdd0; --line:#8997aa; --panel:#182332; --panel-2:#223146; --accent:#aaa5ff; --accent-soft:#302e5d; --teal:#68d9cb; --teal-soft:#163e3a; --amber:#ffca73; --amber-soft:#493619; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:var(--ink); }
    .title { font-size:25px; font-weight:700; } .subtitle { font-size:14px; fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; } .panel-2 { fill:var(--panel-2); stroke:var(--line); stroke-width:1.2; }
    .accent-panel { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; } .teal-panel { fill:var(--teal-soft); stroke:var(--teal); stroke-width:1.5; } .amber-panel { fill:var(--amber-soft); stroke:var(--amber); stroke-width:1.5; }
    .label { font-size:16px; font-weight:700; } .body { font-size:13px; fill:var(--muted); } .small { font-size:12px; fill:var(--muted); }
    .bus { fill:none; stroke:var(--teal); stroke-width:3; } .uart { fill:none; stroke:var(--accent); stroke-width:3; }
    .connector { fill:var(--panel); stroke:var(--line); stroke-width:1.2; } .pin { fill:var(--teal); }
  </style>

  <text class="title" x="28" y="38">CoreS3 + Stack-chan 底座</text>
  <text class="subtitle" x="28" y="62">标准机硬件连接与总线参数</text>

  <text class="label" x="150" y="102" text-anchor="middle" fill="var(--teal)">I²C 设备</text>
  <path class="bus" d="M284 128 V428 M284 250 H342"/>

  <g>
    <rect class="teal-panel" x="28" y="122" width="230" height="62" rx="11"/>
    <text class="label" x="48" y="148">Si12T</text>
    <text class="body" x="48" y="170">头顶触摸 · 0x68 · 前 / 中 / 后</text>
    <path class="bus" d="M258 153 H284"/>
  </g>
  <g>
    <rect class="teal-panel" x="28" y="202" width="230" height="62" rx="11"/>
    <text class="label" x="48" y="228">INA226</text>
    <text class="body" x="48" y="250">电池计 · 0x41</text>
    <path class="bus" d="M258 233 H284"/>
  </g>
  <g>
    <rect class="teal-panel" x="28" y="282" width="230" height="68" rx="11"/>
    <text class="label" x="48" y="308">PY32</text>
    <text class="body" x="48" y="330">IO 扩展 · 0x6F · Pin 0</text>
    <text class="small" x="48" y="346">控制舵机 VM 电源</text>
    <path class="bus" d="M258 316 H284"/>
  </g>
  <g>
    <rect class="teal-panel" x="28" y="368" width="230" height="62" rx="11"/>
    <text class="label" x="48" y="394">AXP2101</text>
    <text class="body" x="48" y="416">PMIC · 0x34 · M5Unified 管理</text>
    <path class="bus" d="M258 399 H284"/>
  </g>

  <g>
    <rect class="panel" x="342" y="92" width="278" height="354" rx="22"/>
    <rect class="panel-2" x="360" y="110" width="242" height="190" rx="15"/>
    <rect class="accent-panel" x="382" y="132" width="198" height="126" rx="10"/>
    <text class="label" x="481" y="174" text-anchor="middle">320 × 240 IPS</text>
    <text class="body" x="481" y="200" text-anchor="middle">触摸屏</text>
    <path d="M448 225 Q465 208 481 225 Q497 242 514 225" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <circle cx="448" cy="225" r="3" fill="var(--teal)"/><circle cx="481" cy="225" r="3" fill="var(--teal)"/><circle cx="514" cy="225" r="3" fill="var(--teal)"/>
    <text class="label" x="481" y="330" text-anchor="middle">M5Stack CoreS3</text>
    <text class="small" x="481" y="354" text-anchor="middle">ESP32-S3R8 · 8 MB PSRAM · 16 MB Flash</text>
    <rect class="connector" x="364" y="380" width="104" height="42" rx="8"/>
    <rect class="connector" x="494" y="380" width="104" height="42" rx="8"/>
    <circle class="pin" cx="379" cy="401" r="4"/>
    <text class="body" x="417" y="406" text-anchor="middle">I²C</text>
    <circle cx="583" cy="401" r="4" fill="var(--accent)"/>
    <text class="body" x="545" y="406" text-anchor="middle">UART1</text>
    <text class="small" x="481" y="470" text-anchor="middle">Stack-chan 底座</text>
  </g>

  <path class="uart" d="M620 250 H672 V181 H700 M672 250 V333 H700"/>
  <text class="label" x="805" y="102" text-anchor="middle" fill="var(--accent)">UART1 舵机总线</text>
  <text class="body" x="805" y="122" text-anchor="middle">TX GPIO 6 · RX GPIO 7 · 1 Mbps · 8N1</text>
  <g>
    <rect class="accent-panel" x="700" y="145" width="232" height="76" rx="12"/>
    <circle cx="728" cy="183" r="17" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M728 166 V200 M711 183 H745" stroke="var(--accent)" stroke-width="2" opacity=".65"/>
    <text class="label" x="762" y="178">偏航 SCS0009</text>
    <text class="body" x="762" y="201">ID 1 · 零位 460</text>
  </g>
  <g>
    <rect class="accent-panel" x="700" y="295" width="232" height="76" rx="12"/>
    <circle cx="728" cy="333" r="17" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M728 316 V350 M711 333 H745" stroke="var(--accent)" stroke-width="2" opacity=".65"/>
    <text class="label" x="762" y="328">俯仰 SCS0009</text>
    <text class="body" x="762" y="351">ID 2 · 零位 620</text>
  </g>
  <rect class="amber-panel" x="700" y="395" width="232" height="42" rx="9"/>
  <text class="small" x="816" y="421" text-anchor="middle">舵机上电后等待 200 ms 再访问总线</text>
</svg>
